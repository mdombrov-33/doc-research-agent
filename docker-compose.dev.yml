services:
  agent-api:
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src

  ui:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://agent-api:8000
      QDRANT_MODE: local
      QDRANT_LOCAL_URL: http://qdrant:6333
    volumes:
      - ./src:/app/src
      - ./ui.py:/app/ui.py
    depends_on:
      - agent-api
